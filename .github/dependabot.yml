version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      go-compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
