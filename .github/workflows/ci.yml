name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: |
          go test -race ./cmd/agent ./internal/api
          sh -n scripts/install-agent.sh
          sh -n scripts/uninstall-agent.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-installer.ps1
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: sshguard_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: sshguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sshguard_test -d sshguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/api -run TestIntegration -count=1 -v
        env:
          TEST_DB_DRIVER: postgres
          TEST_DATABASE_URL: postgres://sshguard_test:ci-local-only@127.0.0.1:5432/sshguard_test?sslmode=disable
          GIN_MODE: release
  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: sshguard_test
          MYSQL_USER: sshguard_test
          MYSQL_PASSWORD: ci-local-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/api -run TestIntegration -count=1 -v
        env:
          TEST_DB_DRIVER: mysql
          TEST_DATABASE_URL: sshguard_test:ci-local-only@tcp(127.0.0.1:3306)/sshguard_test?parseTime=true&loc=UTC&charset=utf8mb4
          GIN_MODE: release
  web:
    name: Vue build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - run: node scripts/check-docs.mjs
  build:
    name: Build API + cross-platform Agents
    if: github.event_name != 'pull_request'
    needs: [go, postgres, mysql, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          node scripts/build-release.mjs amd64
          node scripts/build-release.mjs arm64 --reuse-web
          node scripts/check-agent-artifacts.mjs
          node scripts/check-agent-artifacts.mjs dist/sshguard-linux-arm64/web/downloads
          node scripts/package-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sshguard-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
