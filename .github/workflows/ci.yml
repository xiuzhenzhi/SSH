name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'package.json', 'package-lock.json', 'scripts/build/build-docs.mjs', 'scripts/checks/check-docs.mjs', '.github/workflows/docs.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'package.json', 'package-lock.json', 'scripts/build/build-docs.mjs', 'scripts/checks/check-docs.mjs', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      full_validation:
        description: Build packages and run the full installation/update matrix
        type: boolean
        default: false
  workflow_call:
    inputs:
      selective_release:
        type: boolean
        default: false
      source_ref:
        description: Exact commit selected by the release workflow
        required: false
        type: string
      full_validation:
        description: Include package and native installation validation
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full_validation && 'full' || 'checks' }}
  cancel-in-progress: true
jobs:
  scope:
    name: Changes and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.plan.outputs.server }}
      automation: ${{ steps.plan.outputs.automation }}
      web: ${{ steps.plan.outputs.web }}
      agent: ${{ steps.plan.outputs.agent }}
      database: ${{ steps.plan.outputs.database }}
      deploy: ${{ steps.plan.outputs.deploy }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
          SELECTIVE_RELEASE: ${{ inputs.selective_release == true }}
        run: node scripts/checks/ci-plan.mjs
      - run: node --test scripts/tests/ci-plan.test.mjs
  server:
    name: 主控 CI / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - if: runner.os == 'Windows'
        run: go test ./cmd/api ./internal/api ./internal/server ./internal/geoip ./internal/notify ./internal/ipaddress ./internal/originurl
      - if: runner.os == 'Linux'
        run: go test -race ./cmd/api ./internal/api ./internal/server ./internal/geoip ./internal/notify ./internal/ipaddress ./internal/originurl
      - run: go vet ./cmd/api ./internal/api ./internal/server ./internal/geoip ./internal/notify ./internal/ipaddress ./internal/originurl
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/api ./internal/api ./internal/server ./internal/geoip ./internal/notify ./internal/ipaddress ./internal/originurl
      - run: go build ./cmd/api
  agent:
    name: Agent CI / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.agent == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - if: runner.os == 'Windows'
        run: go test ./cmd/agent ./internal/agent ./internal/ipaddress ./internal/originurl
      - if: runner.os == 'Linux'
        run: go test -race ./cmd/agent ./internal/agent ./internal/ipaddress ./internal/originurl
      - run: go vet ./cmd/agent ./internal/agent ./internal/ipaddress ./internal/originurl
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/agent ./internal/agent ./internal/ipaddress ./internal/originurl
      - run: go test -tags=nethttpomithttp2 ./internal/agent
      - run: go build -tags=nethttpomithttp2 ./cmd/agent
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tests/test-windows-service.ps1
          ./scripts/tests/test-windows-installer.ps1
          ./scripts/tests/test-windows-uninstall.ps1
      - if: runner.os == 'Linux'
        run: |
          sh -n scripts/install-agent.sh
          sh -n scripts/uninstall-agent.sh
  database:
    name: 数据库 CI / SQLite
    needs: scope
    if: needs.scope.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/storage/... ./internal/api
      - run: go vet ./internal/storage/...
  automation:
    name: 构建与部署脚本 CI
    needs: scope
    if: needs.scope.outputs.automation == 'true' || needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: node --test scripts/tests/*.test.mjs
      - run: |
          sh -n sshguard.sh
          sh -n scripts/deploy.sh
          sh -n scripts/quick-start.sh
          sh -n scripts/update.sh
          sh -n scripts/uninstall.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/docs.yml
  compatibility:
    name: 主控与 Agent 兼容性
    needs: scope
    if: needs.scope.outputs.server == 'true' && needs.scope.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: |
          mkdir -p .local/direct-flow
          go build -o .local/direct-flow/api ./cmd/api
          go build -o .local/direct-flow/agent ./cmd/agent
          node scripts/tests/test-direct-flow.mjs .local/direct-flow/api .local/direct-flow/agent
  postgres:
    name: 数据库 CI / PostgreSQL
    needs: scope
    if: needs.scope.outputs.database == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: sshguard_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: sshguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sshguard_test -d sshguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/api -run TestIntegration -count=1 -v
        env:
          TEST_DB_DRIVER: postgres
          SSHGUARD_LOAD_TEST: '1'
          TEST_DATABASE_URL: postgres://sshguard_test:ci-local-only@127.0.0.1:5432/sshguard_test?sslmode=disable
          GIN_MODE: release
  mysql:
    name: 数据库 CI / MySQL ${{ matrix.version }}
    needs: scope
    if: needs.scope.outputs.database == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['5.6.51', '8.4.13']
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: sshguard_test
          MYSQL_USER: sshguard_test
          MYSQL_PASSWORD: ci-local-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/api -run TestIntegration -count=1 -v
        env:
          TEST_DB_DRIVER: mysql
          SSHGUARD_LOAD_TEST: '1'
          TEST_DATABASE_URL: sshguard_test:ci-local-only@tcp(127.0.0.1:3306)/sshguard_test?parseTime=true&loc=UTC&charset=utf8mb4
          GIN_MODE: release
  web:
    name: 前端 CI / 构建或复用
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        id: web-cache
        with:
          path: web/dist
          key: verified-web-${{ runner.os }}-${{ hashFiles('web/**') }}
      - if: needs.scope.outputs.web == 'true' || steps.web-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
      - if: steps.web-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.full_validation == true
        with:
          name: sshguard-verified-web
          path: web/dist
          if-no-files-found: error
          retention-days: 1
  docker:
    name: Docker application builds
    if: inputs.full_validation == true && github.event_name != 'pull_request' && (inputs.selective_release != true || needs.scope.outputs.server == 'true' || needs.scope.outputs.database == 'true' || needs.scope.outputs.web == 'true' || needs.scope.outputs.deploy == 'true')
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - if: inputs.selective_release != true || needs.scope.outputs.server == 'true' || needs.scope.outputs.database == 'true' || needs.scope.outputs.deploy == 'true'
        run: docker build --tag sshguard-api:verify --file deploy/Dockerfile.api .
      - if: inputs.selective_release != true || needs.scope.outputs.web == 'true' || needs.scope.outputs.deploy == 'true'
        run: docker build --tag sshguard-web:verify --file deploy/Dockerfile.web .
  build:
    name: Build release candidate
    if: ${{ !cancelled() && inputs.full_validation == true && github.event_name != 'pull_request' && needs.scope.result == 'success' && (needs.web.result == 'success' || needs.web.result == 'skipped') && !contains(needs.*.result, 'failure') }}
    needs: [scope, server, agent, database, automation, compatibility, postgres, mysql, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.scope.outputs.web == 'true'
        with:
          name: sshguard-verified-web
          path: web/dist
      - name: Reuse unchanged verified frontend
        if: needs.scope.outputs.web != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build/reuse-web.mjs
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build/build-release.mjs amd64 --reuse-web
          node scripts/build/build-release.mjs arm64 --reuse-web --reuse-agents
          node scripts/checks/check-agent-artifacts.mjs
          node scripts/checks/check-agent-artifacts.mjs dist/sshguard-linux-arm64/web/downloads
          node scripts/build/package-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sshguard-build-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  native:
    name: Native install and upgrade / ${{ matrix.database }} / ${{ matrix.proxy }}
    needs: [build, scope]
    if: inputs.selective_release != true || needs.scope.outputs.server == 'true' || needs.scope.outputs.database == 'true' || needs.scope.outputs.agent == 'true' || needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-build-candidate
          path: dist/release
      - name: Verify and extract the exact candidate
        working-directory: dist/release
        run: |
          sha256sum -c SHA256SUMS
          tar -xzf sshguard-linux-amd64.tar.gz -C ..
      - name: Verify installation, upgrades, permissions and recovery
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true SSHGUARD_NATIVE_DB=${{ matrix.database }} SSHGUARD_NATIVE_PROXY=${{ matrix.proxy }} sh scripts/tests/test-native-deploy.sh dist/sshguard-linux-amd64
      - name: Verify all proxy templates and real HTTPS WebSockets
        if: matrix.proxy == 'managed' && matrix.database == 'sqlite'
        run: |
          mkdir -p .local/proxy
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout .local/proxy/key.pem -out .local/proxy/cert.pem
          NODE_EXTRA_CA_CERTS="$PWD/.local/proxy/cert.pem" node scripts/tests/test-reverse-proxy.mjs dist/sshguard-linux-amd64/sshguard-api "$(command -v nginx)" .local/proxy/cert.pem .local/proxy/key.pem
  artifacts:
    name: Verified release assets
    needs: [build, native]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-build-candidate
          path: dist/release
      - name: Recheck assets after all deployment tests pass
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sshguard-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  result:
    name: CI result
    if: always() && !cancelled()
    needs: [scope, server, agent, database, automation, compatibility, postgres, mysql, web, docker, build, native, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ inputs.full_validation == true && github.event_name != 'pull_request' }}
          SERVER: ${{ needs.scope.outputs.server }}
          AGENT: ${{ needs.scope.outputs.agent }}
          DATABASE: ${{ needs.scope.outputs.database }}
          WEB: ${{ needs.scope.outputs.web }}
          DEPLOY: ${{ needs.scope.outputs.deploy }}
          AUTOMATION: ${{ needs.scope.outputs.automation }}
          SELECTIVE: ${{ inputs.selective_release == true }}
        run: |
          node <<'NODE'
          const jobs=JSON.parse(process.env.RESULTS), yes=k=>process.env[k]==='true';
          const full=yes('FULL'), server=yes('SERVER'), agent=yes('AGENT'), db=yes('DATABASE'), web=yes('WEB'), deploy=yes('DEPLOY');
          const required={scope:true,server,agent,database:db,postgres:db,mysql:db,
            automation:yes('AUTOMATION')||deploy,compatibility:server&&agent,web,
            docker:full&&(!yes('SELECTIVE')||server||db||web||deploy),build:full,
            native:full&&(!yes('SELECTIVE')||server||db||agent||deploy),artifacts:full};
          let failed=false;
          for(const [name,job] of Object.entries(jobs)){
            const expected=required[name]?'success':'skipped';
            console.log(name+': '+job.result+' (expected '+expected+')');
            if(job.result!==expected)failed=true;
          }
          if(failed)process.exit(1);
          NODE
