name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Build packages and run the full installation/update matrix
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit selected by the release workflow
        required: false
        type: string
      full_validation:
        description: Include package and native installation validation
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full_validation && 'full' || 'checks' }}
  cancel-in-progress: true
jobs:
  scope:
    name: Changes and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
        run: node scripts/ci-plan.mjs
      - run: node scripts/check-docs.mjs
      - run: node --test scripts/ci-plan.test.mjs scripts/release-version.test.mjs scripts/prepare-release.test.mjs scripts/quick-start.test.mjs
  go:
    name: Go / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-service.ps1
      - if: runner.os == 'Windows'
        run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Verify domain-free setup and real Agent flow
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          mkdir -p .local/direct-flow
          go build -o ".local/direct-flow/api$suffix" ./cmd/api
          go build -o ".local/direct-flow/agent$suffix" ./cmd/agent
          node scripts/test-direct-flow.mjs ".local/direct-flow/api$suffix" ".local/direct-flow/agent$suffix"
      - if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          sh -n scripts/install-agent.sh
          sh -n scripts/uninstall-agent.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/deploy.sh
          sh -n scripts/quick-start.sh
          sh -n scripts/update.sh
      - name: Validate GitHub Actions workflows
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-installer.ps1
  postgres:
    name: PostgreSQL integration
    needs: scope
    if: needs.scope.outputs.go == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: sshguard_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: sshguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sshguard_test -d sshguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/api -run TestIntegration -count=1 -v
        env:
          TEST_DB_DRIVER: postgres
          SSHGUARD_LOAD_TEST: '1'
          TEST_DATABASE_URL: postgres://sshguard_test:ci-local-only@127.0.0.1:5432/sshguard_test?sslmode=disable
          GIN_MODE: release
  mysql:
    name: MySQL ${{ matrix.version }} / ${{ matrix.schema }}
    needs: scope
    if: needs.scope.outputs.go == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['5.6.51', '8.4.13']
        schema: ['fresh', 'legacy']
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: sshguard_test
          MYSQL_USER: sshguard_test
          MYSQL_PASSWORD: ci-local-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/api -run TestIntegration -count=1 -v
        env:
          TEST_DB_DRIVER: mysql
          SSHGUARD_LOAD_TEST: '1'
          SSHGUARD_TEST_SCHEMA: ${{ matrix.schema }}
          TEST_DATABASE_URL: sshguard_test:ci-local-only@tcp(127.0.0.1:3306)/sshguard_test?parseTime=true&loc=UTC&charset=utf8mb4
          GIN_MODE: release
  web:
    name: Vue build
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.full_validation == true
        with:
          name: sshguard-verified-web
          path: web/dist
          if-no-files-found: error
          retention-days: 1
  build:
    name: Build release candidate
    if: inputs.full_validation == true && github.event_name != 'pull_request'
    needs: [scope, go, postgres, mysql, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-verified-web
          path: web/dist
      - run: |
          node scripts/build-release.mjs amd64 --reuse-web
          node scripts/build-release.mjs arm64 --reuse-web --reuse-agents
          node scripts/check-agent-artifacts.mjs
          node scripts/check-agent-artifacts.mjs dist/sshguard-linux-arm64/web/downloads
          node scripts/package-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sshguard-build-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  native:
    name: Native install and upgrade / ${{ matrix.database }} / ${{ matrix.proxy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: local-postgres
            proxy: managed
          - database: sqlite
            proxy: managed
          - database: sqlite
            proxy: external
          - database: sqlite
            proxy: standalone
          - database: sqlite
            proxy: standalone-http
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-build-candidate
          path: dist/release
      - name: Verify and extract the exact candidate
        working-directory: dist/release
        run: |
          sha256sum -c SHA256SUMS
          tar -xzf sshguard-linux-amd64.tar.gz -C ..
      - name: Verify installation, upgrades, permissions and recovery
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true SSHGUARD_NATIVE_DB=${{ matrix.database }} SSHGUARD_NATIVE_PROXY=${{ matrix.proxy }} sh scripts/test-native-deploy.sh dist/sshguard-linux-amd64
      - name: Verify all proxy templates and real HTTPS WebSockets
        if: matrix.proxy == 'managed' && matrix.database == 'sqlite'
        run: |
          mkdir -p .local/proxy
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout .local/proxy/key.pem -out .local/proxy/cert.pem
          NODE_EXTRA_CA_CERTS="$PWD/.local/proxy/cert.pem" node scripts/test-reverse-proxy.mjs dist/sshguard-linux-amd64/sshguard-api "$(command -v nginx)" .local/proxy/cert.pem .local/proxy/key.pem
  artifacts:
    name: Verified release assets
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-build-candidate
          path: dist/release
      - name: Recheck assets after all deployment tests pass
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sshguard-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  result:
    name: CI result
    if: always() && !cancelled()
    needs: [scope, go, postgres, mysql, web, build, native, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_VALIDATION: ${{ inputs.full_validation == true && github.event_name != 'pull_request' }}
          GO_REQUIRED: ${{ needs.scope.outputs.go }}
          WEB_REQUIRED: ${{ needs.scope.outputs.web }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          const full = process.env.FULL_VALIDATION === 'true';
          const packageJobs = new Set(['build', 'native', 'artifacts']);
          const backendJobs = new Set(['go', 'postgres', 'mysql']);
          let failed = false;
          for (const [name, job] of Object.entries(jobs)) {
            const skipped = (packageJobs.has(name) && !full) ||
              (backendJobs.has(name) && process.env.GO_REQUIRED !== 'true') ||
              (name === 'web' && process.env.WEB_REQUIRED !== 'true');
            const expected = skipped ? 'skipped' : 'success';
            console.log(name + ': ' + job.result);
            if (job.result !== expected) failed = true;
          }
          if (failed) process.exit(1);
          NODE
