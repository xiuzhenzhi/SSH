name: Recover v0.3.21 release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recover-v0321
  cancel-in-progress: false
# One-time recovery authorized after the original run and candidate were deleted.
# The five installation checks already passed; only HTTPS required a test fix.
# Pin the original version commit, never prepare a new version or move its tag.
jobs:
  rebuild:
    name: Rebuild missing packages and verify HTTPS only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 29466c951c3acb0ea96d5fbf45d2e73bfa46fcc2
      - name: Require original immutable version
        run: |
          test "$(git rev-parse 'v0.3.21^{commit}')" = "$(git rev-parse HEAD)"
          test "$(cat VERSION)" = '0.3.21'
          test "$(cat AGENT_VERSION)" = '0.3.20'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Reuse verified frontend and Agent; rebuild missing controller packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build/reuse-web.mjs
          node scripts/build/build-release.mjs amd64 --reuse-web
          node scripts/build/build-release.mjs arm64 --reuse-web --reuse-agents
          node scripts/build/package-release.mjs
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Load corrected isolated proxy verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .local/proxy-verifier
          sparse-checkout: scripts/tests/test-reverse-proxy.mjs
          sparse-checkout-cone-mode: false
      - name: Install test proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Verify HTTPS and WebSockets only
        run: |
          mkdir -p .local/proxy
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout .local/proxy/key.pem -out .local/proxy/cert.pem
          NODE_EXTRA_CA_CERTS="$PWD/.local/proxy/cert.pem" node .local/proxy-verifier/scripts/tests/test-reverse-proxy.mjs dist/sshguard-linux-amd64/sshguard-api "$(command -v nginx)" .local/proxy/cert.pem .local/proxy/key.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sshguard-release-assets
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    name: Publish v0.3.21
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sshguard-release-assets
          path: dist/release
      - name: Verify and publish original version assets
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          cp RELEASE-NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\n\n发布恢复说明：原构建与五组安装升级验证已通过，运行记录及产物随后被删除。本次按确认范围从原标签重新生成主控包，复用未变化的前端和 Agent，仅补验 HTTPS/WebSocket；未重跑已经通过的组件和安装测试。\n' >> "$RUNNER_TEMP/release-notes.md"
          gh release create v0.3.21 ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title 'SSHGuard v0.3.21' --notes-file "$RUNNER_TEMP/release-notes.md"
  containers:
    name: Publish v0.3.21 Docker images
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      tag: v0.3.21
