name: 构建与发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '可选：留空时根据当前分支的 GitHub Release 自动递增补丁版本；例如 0.3.2 或 0.4.0-rc.1'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare version on selected branch
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Choose version and update release files
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs
      - name: Commit and create immutable version tag
        id: commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION cmd/agent/main.go internal/api/routes.go scripts/quick-start.sh scripts/install-agent.sh scripts/install-agent.ps1 README.md CHANGELOG.md docs/QUICKSTART.md docs/INSTALL-NATIVE.md docs/RELEASING.md docs/RELEASE-NOTES.md
          git diff --cached --check
          git commit -m "release: prepare SSHGuard $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "SSHGuard $RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    name: Verify release tag
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
      - name: Match tag to VERSION
        id: verify
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
          PREPARED_TAG: ${{ needs.prepare.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if test "$REF_TYPE" = tag && test -n "$REQUESTED_VERSION"; then
            echo 'For a new version select a branch. For an existing tag leave the version input empty.' >&2
            exit 1
          fi
          test "$REF_TYPE" = tag || test -n "$PREPARED_TAG"
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    name: Validate and build
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.verify.outputs.sha }}
  publish:
    name: Publish verified release
    needs: [verify, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-release-assets
          path: dist/release
      - name: Verify packaged checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag "${flags[@]}" \
            --title "SSHGuard $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
