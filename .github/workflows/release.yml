name: 构建与发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag || { echo 'Select an existing version tag when running manually.' >&2; exit 1; }
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
  build:
    name: Validate and build
    needs: verify
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-release-assets
          path: dist/release
      - name: Verify packaged checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag "${flags[@]}" \
            --title "SSHGuard $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
