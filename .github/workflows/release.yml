name: 构建与发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '可选：留空时根据当前分支的 GitHub Release 自动递增补丁版本；例如 0.3.2 或 0.4.0-rc.1'
        required: false
        type: string
      existing_tag:
        description: '仅重试尚未发布的既有标签（例如 v0.3.21）；使用当前工作流验证原标签代码，不改写标签。与 version 互斥。'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare version on selected branch
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && !inputs.existing_tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Choose version and update release files
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release/prepare-release.mjs
      - name: Commit and create immutable version tag
        id: commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'xiuzhenzhi'
          git config user.email 'xiuzhengzhi66@gmail.com'
          git add VERSION AGENT_VERSION internal/agent/run.go internal/api/routes.go sshguard.sh scripts/install-agent.sh scripts/install-agent.ps1 README.md CHANGELOG.md docs/guides/QUICKSTART.md docs/deployment/INSTALL-NATIVE.md docs/development/RELEASING.md docs/RELEASE-NOTES.md
          git diff --cached --check
          git commit -m "release: prepare SSHGuard $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "SSHGuard $RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    name: Verify release tag
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.existing_tag && format('refs/tags/{0}', inputs.existing_tag) || needs.prepare.outputs.sha || github.sha }}
      - name: Match tag to VERSION
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.existing_tag || needs.prepare.outputs.tag || github.ref_name }}
          PREPARED_TAG: ${{ needs.prepare.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
          EXISTING_TAG: ${{ inputs.existing_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -n "$EXISTING_TAG"; then
            test -z "$REQUESTED_VERSION"
            printf '%s' "$EXISTING_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'
            if gh release view "$EXISTING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo 'Release already exists; published assets and tags are immutable.' >&2
              exit 1
            fi
          fi
          if test "$REF_TYPE" = tag && test -n "$REQUESTED_VERSION"; then
            echo 'For a new version select a branch. For an existing tag leave the version input empty.' >&2
            exit 1
          fi
          test "$REF_TYPE" = tag || test -n "$PREPARED_TAG" || test -n "$EXISTING_TAG"
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    name: Validate and build
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.verify.outputs.sha }}
      full_validation: true
      selective_release: true
  publish:
    name: Publish verified release
    needs: [verify, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sshguard-release-assets
          path: dist/release
      - name: Verify packaged checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag "${flags[@]}" \
            --title "SSHGuard $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
  containers:
    name: Publish Docker images
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
