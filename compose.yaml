services:
  api:
    image: ghcr.io/xiuzhenzhi/sshguard-api:${SSHGUARD_IMAGE_TAG:-v0.3.20}
    restart: unless-stopped
    environment:
      DB_DRIVER: ${DB_DRIVER:?Run scripts/dev/init-env.mjs}
      DATABASE_URL: ${DATABASE_URL:?Run scripts/dev/init-env.mjs}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate and preserve a 64-character hex encryption key}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      NOTIFICATION_ALLOWED_HOSTS: ${NOTIFICATION_ALLOWED_HOSTS:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      GIN_MODE: release
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    image: ghcr.io/xiuzhenzhi/sshguard-web:${SSHGUARD_IMAGE_TAG:-v0.3.20}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
