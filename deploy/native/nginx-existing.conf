# Paste inside an existing server block (Nginx / OpenResty / Baota).
# Replace the existing root location; do not wrap this in another server block.
# The panel keeps ownership of listen, server_name and TLS certificates.
location ^~ / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    # For a custom public port, set PUBLIC_URL to the exact external origin.
    # If the upstream also needs that port in Host, use $http_host here.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A server-only snippet cannot define an http-level map. Nginx supports
    # this simple WebSocket form; an empty Upgrade header is not forwarded.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 1m;
}
