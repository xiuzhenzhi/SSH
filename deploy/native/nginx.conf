# Install inside nginx http context, e.g. /etc/nginx/conf.d/sshguard.conf.
limit_req_zone $binary_remote_addr zone=sshguard_login:10m rate=5r/m;
server {
    listen 80;
    server_name guard.example.com;
    location /.well-known/acme-challenge/ { root /var/lib/sshguard/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name guard.example.com;
    ssl_certificate /etc/sshguard/certs/fullchain.pem;
    ssl_certificate_key /etc/sshguard/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/sshguard/web;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/v1/auth/login {
        limit_req zone=sshguard_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_read_timeout 30s; }
    location /downloads/ { default_type application/octet-stream; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
