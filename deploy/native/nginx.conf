# Install inside nginx http context, e.g. /etc/nginx/conf.d/sshguard.conf.
limit_req_zone $binary_remote_addr zone=sshguard_login:10m rate=5r/m;
map $http_upgrade $sshguard_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name guard.example.com;
    location /.well-known/acme-challenge/ { root /var/lib/sshguard/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name guard.example.com;
    ssl_certificate /etc/sshguard/certs/fullchain.pem;
    ssl_certificate_key /etc/sshguard/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com/turnstile/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://static.geetest.com/ https://static.geevisit.com/ https://gcaptcha4.geetest.com/ https://gcaptcha4.geevisit.com/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.geetest.com https://static.geevisit.com https://gcaptcha4.geetest.com; connect-src 'self' https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com; frame-src 'self' https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://static.geetest.com https://static.geevisit.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_http_version 1.1;
    # For a custom public port, set PUBLIC_URL to the exact external origin.
    # If the upstream also needs that port in Host, use $http_host here.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sshguard_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_cache off;
    location = /api/v1/auth/login {
        limit_req zone=sshguard_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    # Proxy the entire native app, including setup, assets and downloads.
    # The API confines public files to web/ and rejects hidden paths.
    location / { proxy_pass http://127.0.0.1:8080; }
}
