server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_cache off;
    location ~ (^|/)\. { return 404; }
    # Only the two streaming endpoints permit an HTTP upgrade.
    location ~ ^/api/v1/(agent/stream|live)$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # Custom public port: PUBLIC_URL must contain it; use $http_host if needed.
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
    location /downloads/ { default_type application/octet-stream; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
