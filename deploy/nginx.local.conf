# Fresh nonces must not be reused from cached HTML. Assets retain their cache policy.
map $sent_http_content_type $sshguard_web_html_cache {
    default "";
    ~*^text/html "no-store";
}
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com/beacon.min.js https://static.cloudflareinsights.com/beacon.min.js/ https://challenges.cloudflare.com/turnstile/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://static.geetest.com/ https://static.geevisit.com/ https://gcaptcha4.geetest.com/ https://gcaptcha4.geevisit.com/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.geetest.com https://static.geevisit.com https://gcaptcha4.geetest.com; connect-src 'self' https://cloudflareinsights.com/cdn-cgi/rum https://cloudflareinsights.com/cdn-cgi/rum/ https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com; frame-src 'self' https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://static.geetest.com https://static.geevisit.com; object-src 'none'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $sshguard_web_html_cache always;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_cache off;
    location ~ (^|/)\. { return 404; }
    # Only the two streaming endpoints permit an HTTP upgrade.
    location ~ ^/api/v1/(agent/stream|live)$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # Custom public port: PUBLIC_URL must contain it; use $http_host if needed.
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Real-IP $remote_addr; }
    location /downloads/ { default_type application/octet-stream; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
